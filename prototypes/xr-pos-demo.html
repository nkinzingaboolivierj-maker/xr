<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XR — Business Management &amp; POS (Demo)</title>
<style>
  :root{
    --bg:#F6F5F1; --surface:#FFFFFF; --ink:#161F1A; --ink-muted:#6E7469; --ink-faint:#A7AA9F;
    --border:#E4E1D8; --line:#EDEAE1; --accent:#1F6F55; --accent-soft:#E6F1EC;
    --warn:#A9752B; --warn-soft:#FBF0DE; --danger:#AE4230; --danger-soft:#FBEAE5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #app{position:relative;width:100%;height:min(680px,92vh);border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg);}
  .mono{font-family:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .wrap{flex-wrap:wrap;}
  .gap1{gap:4px;} .gap2{gap:8px;} .gap3{gap:12px;}
  .grow{flex:1;}
  .small{font-size:11px;} .xs{font-size:12px;} .sm{font-size:13px;} .base{font-size:14px;} .lg{font-size:18px;}
  .muted{color:var(--ink-muted);} .faint{color:var(--ink-faint);} .accent{color:var(--accent);} .danger{color:var(--danger);}
  .semibold{font-weight:600;} .bold{font-weight:700;} .medium{font-weight:500;}
  .hero-label{font-size:12px;color:var(--ink-muted);}
  .hero-value{font-size:40px;font-weight:700;letter-spacing:-0.02em;line-height:1.05;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .list-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .chip-row{display:flex;gap:6px;}
  .chip{border:1px solid var(--border);background:#fff;color:var(--ink-muted);border-radius:999px;padding:6px 13px;font-size:11px;font-weight:600;cursor:pointer;}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn{border:none;cursor:pointer;border-radius:9px;font-size:12px;font-weight:600;padding:8px 13px;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-accent{background:var(--accent);color:#fff;border:none;}
  .btn-dark{background:var(--ink);color:#fff;border:none;}
  .btn-block{width:100%;justify-content:center;padding:11px;font-size:13px;}
  input{font:inherit;color:inherit;}
  .input{border:1px solid transparent;border-radius:9px;padding:7px 10px;font-size:12px;outline:none;background:var(--bg);width:100%;transition:border-color .12s ease;}
  .input:focus{border-color:var(--accent);background:#fff;}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
  .brandmark{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
  .banner{background:var(--warn-soft);border-bottom:1px solid var(--border);padding:8px 18px;font-size:12px;color:#6B5220;display:flex;gap:8px;align-items:flex-start;}
  .content{padding:18px;}
  .grid{display:grid;gap:12px;}
  .grid-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .grid-products{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
  .pos-layout{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:760px){.pos-layout{grid-template-columns:3fr 2fr;}}
  .pos-products{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th{text-align:left;font-weight:500;color:var(--ink-muted);background:var(--bg);padding:8px 12px;}
  td{padding:8px 12px;border-top:1px solid var(--line);}
  tr.saleRow{cursor:pointer;}
  tr.saleRow:hover{background:rgba(0,0,0,0.02);}
  .bar-track{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden;display:block;}
  .bar-fill{height:100%;background:var(--accent);border-radius:99px;display:block;}
  .empty{text-align:center;color:var(--ink-faint);padding:24px 0;font-size:12px;}
  .cart-item{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;}
  .qtybox{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;background:#fff;}
  .qtybox button{border:none;background:transparent;padding:5px 8px;cursor:pointer;color:var(--ink);}
  .addbtn{width:30px;height:30px;padding:0;justify-content:center;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;}
  .payment-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;}
  .paymethod{border:1px solid var(--border);background:#fff;color:var(--ink-muted);border-radius:8px;padding:7px 4px;font-size:11px;cursor:pointer;}
  .paymethod.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .toast{position:absolute;right:18px;bottom:18px;color:#fff;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:60;}
  .modal-overlay{position:absolute;inset:0;background:rgba(27,30,26,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .receipt{width:100%;max-width:340px;display:flex;flex-direction:column;max-height:92%;}
  .scallop-top{height:12px;background-color:#fff;background-image:radial-gradient(circle at 10px 10px, var(--bg) 9px, transparent 9.5px);background-size:20px 20px;}
  .scallop-bottom{height:12px;background-color:#fff;background-image:radial-gradient(circle at 10px 0px, var(--bg) 9px, transparent 9.5px);background-size:20px 20px;}
  .receipt-body{background:#fff;overflow-y:auto;padding:0 18px;}
  .dashed{border-top:1px dashed var(--border);}
  .icon{vertical-align:middle;display:inline-block;flex-shrink:0;}
  .activity-item{padding:9px 0;border-top:1px dashed var(--border);}
  .activity-item:first-child{border-top:none;}
  .monogram{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}

  /* App shell: sidebar + topbar ------------------------------------- */
  .shell{display:flex;height:100%;min-height:0;}
  .sidebar{width:222px;flex-shrink:0;height:100%;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .15s ease;overflow:hidden;}
  .sidebar.collapsed{width:68px;}
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:16px 14px 12px 14px;}
  .sidebar-brand .brand-text{font-size:13px;font-weight:600;line-height:1.35;white-space:nowrap;}
  .sidebar-brand .brand-text span{display:block;font-size:10px;font-weight:400;color:var(--ink-muted);}
  .sidebar.collapsed .brand-text{display:none;}
  .sidebar-toggle{margin:0 10px 10px 10px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px;cursor:pointer;color:var(--ink-muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .sidebar-nav{flex:1;min-height:0;overflow-y:auto;padding:2px 10px;display:flex;flex-direction:column;gap:2px;}
  .side-group-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:14px 10px 4px 10px;}
  .side-group-label:first-child{padding-top:4px;}
  .sidebar.collapsed .side-group-label{display:none;}
  .sidebar-footer{padding:10px;border-top:1px solid var(--border);flex-shrink:0;}
  .side-item{border:none;background:transparent;color:var(--ink-muted);display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;text-align:left;white-space:nowrap;width:100%;}
  .side-item:hover{background:var(--bg);}
  .side-item.active{background:var(--ink);color:#fff;}
  .side-item .icon{flex-shrink:0;}
  .side-item .label{overflow:hidden;text-overflow:ellipsis;}
  .sidebar.collapsed .side-item{justify-content:center;padding:9px;}
  .sidebar.collapsed .side-item .label{display:none;}
  .main-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;}
  .topbar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);}
  .topbar-brand-mobile{display:none;font-weight:700;font-size:13px;flex-shrink:0;}
  .topbar-search{flex:1;max-width:280px;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px;}
  .topbar-search input{border:none;outline:none;background:transparent;font-size:12px;width:100%;color:var(--ink);}
  .topbar-icon-btn{border:1px solid var(--border);background:#fff;color:var(--ink-muted);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .topbar-newsale{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 12px;height:32px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;white-space:nowrap;}
  .topbar-context{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .topbar-business{font-size:12px;font-weight:500;color:var(--ink-muted);white-space:nowrap;}
  .topbar-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  .placeholder-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;color:var(--ink-faint);text-align:center;}
  .placeholder-screen .ph-icon{width:56px;height:56px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
  .content{overflow-y:auto;flex:1;min-height:0;}
  .mobile-bottom-nav{display:none;}
  .mobile-more-sheet{display:none;}
  @media (max-width:640px){
    .sidebar{display:none;}
    .topbar-search, .topbar-icon-btn.scan-btn, .topbar-newsale, .topbar-business{display:none;}
    .topbar-brand-mobile{display:block;}
    .content{padding-bottom:78px;}
    .mobile-bottom-nav{
      display:flex;position:absolute;left:0;right:0;bottom:0;background:var(--surface);
      border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)) 4px;z-index:40;
    }
    .mobile-bottom-nav button{flex:1;border:none;background:transparent;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;padding:4px 0;cursor:pointer;}
    .mobile-bottom-nav button.active{color:var(--accent);}
    .mobile-more-sheet.open{display:block;position:absolute;inset:0;background:rgba(27,30,26,.4);z-index:55;}
    .mobile-more-panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:16px 16px 0 0;padding:8px 8px calc(14px + env(safe-area-inset-bottom,0px)) 8px;max-height:70%;overflow-y:auto;}
    .mobile-more-handle{width:36px;height:4px;border-radius:99px;background:var(--border);margin:6px auto 10px auto;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){

// ---------------------------------------------------------------------
// Palette (kept in sync with the CSS custom properties above) — used
// wherever colors must be resolved directly, e.g. inside generated SVG.
// ---------------------------------------------------------------------
const COLOR = {
  ink:'#1B1E1A', inkMuted:'#767A72',
  accent:'#1F6F55', accentSoft:'#E6F1EC',
  warn:'#A9752B', warnSoft:'#FBF0DE',
  danger:'#AE4230', dangerSoft:'#FBEAE5',
};
// A small, cohesive set of chart colors (not one-per-product) — kept
// entirely within the accent family so nothing here is ever mistaken
// for the semantic --warn/--danger colors used elsewhere in the UI.
// Reused cyclically; the legend label (not the color alone) is what
// identifies each product, per accessibility good practice.
const CHART_COLORS = ['#1F6F55', '#4F9C82', '#7FB8A3', '#2E5E73', '#8B9A94'];
const PRODUCT_COLOR = {

  p6:CHART_COLORS[0], p7:CHART_COLORS[1], p8:CHART_COLORS[2], p9:CHART_COLORS[3], p10:CHART_COLORS[4],

// ---------------------------------------------------------------------

const ICON_PATHS = {

  x:'<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>',
  printer:'<polyline points="6 9 6 3 18 3 18 9"/><rect x="4" y="9" width="16" height="8" rx="1"/><rect x="6" y="15" width="12" height="6"/>',
  message:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1.2-4A8.4 8.4 0 0 1 3 12 8.5 8.5 0 1 1 21 11.5z"/>',
  rotate:'<polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 2-9.5L1 10"/>',
  chevron:'<polyline points="9 18 15 12 9 6"/>',
  info:'<circle cx="12" cy="12" r="9"/><line x1="12" y1="16" x2="12" y2="11.5"/><circle cx="12" cy="8" r="0.9" fill="currentColor" stroke="none"/>',
  bag:'<path d="M6 8h12l1 12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  users:'<circle cx="8.5" cy="8" r="3"/><path d="M2.5 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15 14.3c2.6.5 4.5 2.7 5 5.7"/>',
  wallet:'<rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="17" cy="15" r="1.2" fill="currentColor" stroke="none"/>',
  trending:'<polyline points="3 17 9 11 13 15 21 6"/><polyline points="15 6 21 6 21 12"/>',
  file:'<path d="M7 2h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><polyline points="14 2 14 7 19 7"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/>',

  panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>'
};
function icon(name, size){
  size = size || 14;
  return '<svg class="icon" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICON_PATHS[name]+'</svg>';
}

// ---------------------------------------------------------------------
// Seed data — demo/development placeholders only (spec Rule 1 / Rule 141).
// Electronics/phones/accessories catalog per reviewer feedback — these
// are development examples, not real market quotations or client data.
// ---------------------------------------------------------------------
function daysAgo(n){ return Date.now() - n*24*60*60*1000; }

const PRODUCTS = [

  { id:'p3',  name:'Tempered Glass Screen Protector', sku:'PRD-000003', qr:'QR-D8Q114', unit:'Piece', department:'Electronics', category:'Phone Accessories', min:1800,   rec:2200,   max:3000   },

  { id:'p5',  name:'Samsung Galaxy A25',           sku:'PRD-000005', qr:'QR-B2N556', unit:'Piece', department:'Electronics', category:'Mobile Phones',        min:265000, rec:285000, max:310000 },
  { id:'p6',  name:'Power Bank 20,000mAh',         sku:'PRD-000006', qr:'QR-W9V271', unit:'Piece', department:'Electronics', category:'Power & Charging',     min:16500,  rec:19000,  max:24000  },
  { id:'p7',  name:'USB-C Charging Cable',         sku:'PRD-000007', qr:'QR-C6R448', unit:'Piece', department:'Electronics', category:'Power & Charging',     min:3200,   rec:3800,   max:5000   },
  { id:'p8',  name:'Bluetooth Earbuds',            sku:'PRD-000008', qr:'QR-E1Y739', unit:'Piece', department:'Electronics', category:'Audio',                min:19500,  rec:23000,  max:28000  },
  { id:'p9',  name:'USB-C Laptop Charger (65W)',   sku:'PRD-000009', qr:'QR-F5U862', unit:'Piece', department:'Electronics', category:'Laptop Accessories',   min:21000,  rec:25000,  max:30000  },
  { id:'p10', name:'Aluminum Laptop Stand',        sku:'PRD-000010', qr:'QR-J3Z190', unit:'Piece', department:'Electronics', category:'Laptop Accessories',   min:13500,  rec:16000,  max:19500  },
];

function seedBatches(){
  return [
    // Wireless Mouse — 2 batches (older + newer) => stock 42, showcases FIFO/aging
    { id:'b1',  productId:'p1',  batchNumber:'BATCH-000001', supplier:'Kigali Tech Distributors Ltd', qtyReceived:12, qtyRemaining:12, unitCost:4200,  receivedAt:daysAgo(11) },
    { id:'b2',  productId:'p1',  batchNumber:'BATCH-000002', supplier:'Kigali Tech Distributors Ltd', qtyReceived:30, qtyRemaining:30, unitCost:4500,  receivedAt:daysAgo(3)  },
    // USB-C Hub => stock 18

function fmt(n){ return Math.round(n||0).toLocaleString('en-US'); }
function fmtDate(ts){
  return new Date(ts).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtDateOnly(ts){
  return new Date(ts).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function initials(name){
  const parts = (name||'').trim().split(/\s+/).filter(Boolean);
  if(parts.length===0) return 'XR';
  return parts.map(w=>w[0]).join('').slice(0,3).toUpperCase();
}
function pastDayLabel(n){ return new Date(Date.now()-n*86400000).toLocaleDateString('en-GB',{ weekday:'short' }); }
function relTime(ts){
  const mins = Math.floor((Date.now()-ts)/60000);
  if(mins<1) return 'Just now';
  if(mins<60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if(hrs<24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  if(days===1) return 'Yesterday';
  return days+'d ago';
}
function pctChange(curr, prev){ if(!prev) return 0; return (curr-prev)/prev*100; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
function agingBucket(days){
  if(days<=3) return { label:'Fresh', fg:'var(--accent)', bg:'var(--accent-soft)' };
  if(days<=7) return { label:'Aging', fg:'var(--warn)', bg:'var(--warn-soft)' };
  if(days<=14) return { label:'Old', fg:'var(--warn)', bg:'var(--warn-soft)' };
  return { label:'Critical', fg:'var(--danger)', bg:'var(--danger-soft)' };
}
function stockFor(productId){
  return state.batches.filter(b=>b.productId===productId).reduce((s,b)=>s+b.qtyRemaining,0);
}
function stockValue(){

// ---------------------------------------------------------------------
// Mini chart renderers — plain SVG, no external chart library
// ---------------------------------------------------------------------
function lineAreaChart(points, height){
  const w = 640, h = height||150, pad = 10;
  const values = points.map(p=>p.value);
  const max = Math.max.apply(null, values.concat([1]));
  const min = Math.min.apply(null, values.concat([0]));
  const range = (max-min) || 1;
  const stepX = (w-pad*2)/(points.length-1);
  const xy = points.map((p,i)=>[ pad+i*stepX, h-pad-((p.value-min)/range)*(h-pad*2) ]);
  const line = xy.map((pt,i)=>(i===0?'M':'L')+pt[0].toFixed(1)+','+pt[1].toFixed(1)).join(' ');
  const area = line+' L'+xy[xy.length-1][0].toFixed(1)+','+(h-pad)+' L'+xy[0][0].toFixed(1)+','+(h-pad)+' Z';
  let dots = '';
  xy.forEach((pt,i)=>{
    const last = i===xy.length-1;
    dots += '<circle cx="'+pt[0].toFixed(1)+'" cy="'+pt[1].toFixed(1)+'" r="'+(last?4.5:2.5)+'" fill="'+(last?COLOR.accent:'#fff')+'" stroke="'+COLOR.accent+'" stroke-width="2"/>';
  });
  const svg = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'+
    '<path d="'+area+'" fill="'+COLOR.accentSoft+'" stroke="none"/>'+
    '<path d="'+line+'" fill="none" stroke="'+COLOR.accent+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    dots+'</svg>';
  const labels = '<div class="row between xs faint" style="margin-top:6px;">'+points.map(p=>'<span>'+esc(p.label)+'</span>').join('')+'</div>';
  return svg+labels;
}
function donutChart(segments, size){
  size = size || 132;
  const r = size/2-15, cx=size/2, cy=size/2, circumference=2*Math.PI*r;
  const total = segments.reduce((s,seg)=>s+seg.value,0) || 1;
  let offset = 0, circles = '';
  segments.forEach(seg=>{
    const segLen = seg.value/total*circumference;
    circles += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+seg.color+'" stroke-width="15" '+
      'stroke-dasharray="'+segLen.toFixed(1)+' '+(circumference-segLen).toFixed(1)+'" stroke-dashoffset="'+(-offset).toFixed(1)+'" '+
      'transform="rotate(-90 '+cx+' '+cy+')"/>';
    offset += segLen;
  });
  const svg = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+circles+'</svg>';
  const legend = segments.map(seg=>{
    const pct = Math.round(seg.value/total*100);
    return '<div class="row between xs" style="margin-bottom:7px;"><span class="row gap2"><span style="width:8px;height:8px;border-radius:50%;background:'+seg.color+';display:inline-block;"></span>'+esc(seg.label)+'</span><span class="mono muted">'+pct+'%</span></div>';
  }).join('');
  return '<div class="row wrap" style="align-items:center;gap:18px;"><div>'+svg+'</div><div class="grow" style="min-width:120px;">'+legend+'</div></div>';
}
function trendPill(pct){
  const up = pct>=0;
  return '<span class="badge" style="background:'+(up?'var(--accent-soft)':'var(--danger-soft)')+';color:'+(up?'var(--accent)':'var(--danger)')+';">'+(up?'\u25B2':'\u25BC')+' '+Math.abs(pct).toFixed(1)+'%</span>';
}

// Cart logic
// ---------------------------------------------------------------------
function adjustCart(productId, delta){
  const product = state.products.find(p=>p.id===productId);
  const available = stockFor(productId);
  const item = state.cart.find(i=>i.productId===productId);
  const currentQty = item ? item.qty : 0;
  if(delta>0 && currentQty>=available){ showToast('error','Only '+available+' '+product.unit.toLowerCase()+' available.'); return; }
  const newQty = currentQty+delta;
  if(newQty<=0){ state.cart = state.cart.filter(i=>i.productId!==productId); render(); return; }
  const clamped = Math.min(newQty, available);
  if(item) item.qty = clamped;
  else state.cart.push({ productId, qty:clamped, unitPrice:product.rec });
  render();
}
function removeFromCart(productId){
  state.cart = state.cart.filter(i=>i.productId!==productId);
  render();
}
function setCartPrice(productId, value){
  const item = state.cart.find(i=>i.productId===productId);
  if(!item) return;
  item.unitPrice = parseFloat(value) || 0;
  render();
}
function computeCartLines(){
  return state.cart.map(item=>{
    const product = state.products.find(p=>p.id===item.productId);
    const available = stockFor(item.productId);
    let priceError = null;
    if(item.unitPrice < product.min) priceError = 'Below minimum RWF '+fmt(product.min);
    else if(item.unitPrice > product.max) priceError = 'Above maximum RWF '+fmt(product.max);
    const stockError = item.qty>available ? ('Only '+available+' available') : null;
    return Object.assign({}, item, { product, available, priceError, stockError, lineTotal:item.qty*item.unitPrice });
  });
}

function completeSale(){
  if(state.processing) return;
  const cartLines = computeCartLines();
  if(cartLines.length===0){ showToast('error','Cart is empty.'); return; }
  const hasErrors = cartLines.some(l=>l.priceError||l.stockError);
  if(hasErrors){ showToast('error','Fix price or stock issues before completing the sale.'); return; }
  const subtotal = cartLines.reduce((s,l)=>s+l.lineTotal,0);
  const total = subtotal;
  const cashNum = parseFloat(state.cashReceived)||0;
  if(state.paymentMethod==='Cash' && cashNum<total){ showToast('error','Cash received is less than the total due.'); return; }
  state.processing = true;

  const working = state.batches.map(b=>Object.assign({}, b));
  const saleItems = [];
  for(const line of cartLines){
    let remaining = line.qty;
    const allocations = [];
    const avail = working.filter(b=>b.productId===line.productId && b.qtyRemaining>0).sort((a,b)=>a.receivedAt-b.receivedAt);
    for(const b of avail){
      if(remaining<=0) break;
      const take = Math.min(b.qtyRemaining, remaining);
      if(take>0){ allocations.push({ batchId:b.id, batchNumber:b.batchNumber, qty:take, unitCost:b.unitCost }); b.qtyRemaining -= take; remaining -= take; }
    }
    if(remaining>0){ state.processing=false; showToast('error','Insufficient stock for '+line.product.name+'.'); return; }
    const cost = allocations.reduce((s,a)=>s+a.qty*a.unitCost,0);
    saleItems.push(Object.assign({}, line, { allocations, cost, profit:line.lineTotal-cost }));
  }

  const cogs = saleItems.reduce((s,i)=>s+i.cost,0);
  const profit = total - cogs;
  const saleNumber = 'SAL-'+String(state.saleCounter).padStart(6,'0');
  state.saleCounter += 1;
  const record = {
    id:saleNumber, saleNumber, items:saleItems, subtotal, total, cogs, profit,
    paymentMethod:state.paymentMethod, cashReceived: state.paymentMethod==='Cash'?cashNum:null,
    change: state.paymentMethod==='Cash' ? (cashNum-total) : null,
    customerName:state.customerName||'Walk-in Customer', timestamp:Date.now(),
    businessName:state.businessName,
  };

  state.batches = working;
  state.sales.unshift(record);
  state.receipt = record;
  state.viewingReceipt = true;
  state.cart = [];
  state.cashReceived = '';
  state.processing = false;
  render();
  showToast('success','Sale '+saleNumber+' completed.');
}

// sequence as the real backend (FINAL MASTER PROMPT §19).

function createPurchase(){
  const product = state.products.find(p=>p.id===state.npProductId);
  const qty = parseInt(state.npQty,10);
  const cost = parseFloat(state.npCost);
  if(!product){ showToast('error','Choose a product for the purchase.'); return; }
  if(!state.npSupplier.trim()){ showToast('error','Enter a supplier name.'); return; }
  if(!qty || qty<=0){ showToast('error','Enter a quantity greater than 0.'); return; }
  if(!cost || cost<=0){ showToast('error','Enter a unit cost greater than 0.'); return; }
  const purchaseNumber = 'PUR-'+String(state.purchaseCounter).padStart(6,'0');
  state.purchaseCounter += 1;
  state.purchases.unshift({
    id:'pu_'+purchaseNumber, purchaseNumber, supplierName:state.npSupplier.trim(),
    productId:product.id, quantity:qty, unitCost:cost, purchaseDate:Date.now(),
    status:'DRAFT', receivedAt:null, batchId:null,
  });
  state.npProductId=''; state.npSupplier=''; state.npQty=''; state.npCost='';
  render();
  showToast('success','Draft purchase '+purchaseNumber+' created.');
}

function receivePurchase(purchaseId){
  const purchase = state.purchases.find(p=>p.id===purchaseId);
  if(!purchase){ return; }
  if(purchase.status!=='DRAFT'){ showToast('error','Purchase already received.'); return; }
  const batchNumber = 'BATCH-'+String(state.batchCounter).padStart(6,'0');
  state.batchCounter += 1;
  const batch = {
    id:'b_'+batchNumber, productId:purchase.productId, batchNumber,
    supplier:purchase.supplierName, qtyReceived:purchase.quantity, qtyRemaining:purchase.quantity,
    unitCost:purchase.unitCost, receivedAt:Date.now(),
  };
  state.batches.push(batch);
  purchase.status = 'RECEIVED';
  purchase.receivedAt = batch.receivedAt;
  purchase.batchId = batch.id;
  render();
  showToast('success','Purchase '+purchase.purchaseNumber+' received — stock updated.');
}

// ---------------------------------------------------------------------
// Products — a brand-new product starts with zero stock (no batches
// exist for it yet), same as the real backend: stock only ever comes
// from a received purchase, never from a manual number typed here.
// ---------------------------------------------------------------------
function randomQr(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = 'QR-';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function createProduct(){
  const name = state.pfName.trim();
  const min = parseFloat(state.pfMin), rec = parseFloat(state.pfRec), max = parseFloat(state.pfMax);
  if(!name){ showToast('error','Enter a product name.'); return; }
  if(!min || !rec || !max){ showToast('error','Enter minimum, recommended and maximum price.'); return; }
  if(!(min<=rec && rec<=max)){ showToast('error','Pricing must satisfy minimum ≤ recommended ≤ maximum.'); return; }
  const id = 'p'+state.productCounter;
  const sku = 'PRD-'+String(state.productCounter).padStart(6,'0');
  state.products.push({ id, name, sku, qr:randomQr(), unit:state.pfUnit, department:'Electronics', category:state.pfCategory, min, rec, max });
  PRODUCT_COLOR[id] = CHART_COLORS[(state.productCounter-1) % CHART_COLORS.length];
  state.productCounter += 1;
  state.pfName=''; state.pfMin=''; state.pfRec=''; state.pfMax='';
  state.showAddProduct = false;
  render();
  showToast('success', name+' added — 0 stock until a purchase is received.');
}

// Single source of truth for Revenue/COGS/Gross Profit, reused by
// Dashboard, Expenses and Analytics so the three screens can never show
// contradicting numbers for the same underlying sales (FINAL MASTER
// PROMPT §6 "Source of Truth Map" / §27 "Analytics Reconciliation").
function computeFinanceSummary(){
  const liveRevenue = state.sales.reduce((s,sa)=>s+sa.total,0);
  const liveCOGS = state.sales.reduce((s,sa)=>s+sa.cogs,0);
  const histRevenue = HISTORY.days.reduce((s,d)=>s+d.revenue,0);
  const histCOGS = HISTORY.days.reduce((s,d)=>s+d.cogs,0);
  const revenue = histRevenue+liveRevenue;
  const cogs = histCOGS+liveCOGS;
  const grossProfit = revenue-cogs;
  const margin = revenue>0 ? (grossProfit/revenue*100) : 0;
  const operatingExpenses = state.expenses.reduce((s,e)=>s+e.amount,0);
  const netProfit = grossProfit-operatingExpenses;
  return { liveRevenue, revenue, cogs, grossProfit, margin, operatingExpenses, netProfit };
}

// Single source of truth for per-product units/revenue (seed history +
// live session sales merged), reused by Dashboard and Analytics.
function computeProductStats(){
  const liveByProduct = {};
  state.sales.forEach(sa=>sa.items.forEach(i=>{
    if(!liveByProduct[i.productId]) liveByProduct[i.productId] = { units:0, revenue:0 };
    liveByProduct[i.productId].units += i.qty;
    liveByProduct[i.productId].revenue += i.lineTotal;
  }));
  return state.products.map(p=>{
    const seed = HISTORY.productStats[p.id] || { units:0, revenue:0 };
    const live = liveByProduct[p.id] || { units:0, revenue:0 };
    return { product:p, units:seed.units+live.units, revenue:seed.revenue+live.revenue, stock:stockFor(p.id) };
  });
}

function renderDashboard(){
  const fin = computeFinanceSummary();
  const revTrend = pctChange(fin.revenue, HISTORY.lastWeekRevenue);
  const lastWeekProfit = HISTORY.lastWeekRevenue*0.385;
  const profitTrend = pctChange(fin.grossProfit, lastWeekProfit);

  const chartPoints = HISTORY.days.map(d=>({ label:pastDayLabel(d.n), value:d.revenue })).concat([{ label:'Today', value:fin.liveRevenue }]);

  const merged = computeProductStats().sort((a,b)=>b.revenue-a.revenue);
  const maxRev = Math.max(1, ...merged.map(m=>m.revenue));
  const donutSegments = merged.map(m=>({ label:m.product.name, value:m.revenue, color:PRODUCT_COLOR[m.product.id] }));

  const lowStock = state.products.filter(p=>stockFor(p.id)<state.lowStockThreshold);

    product: state.products.find(p=>p.id===a.productId), qty:a.qty, amount:a.amount, ts: Date.now()-a.hoursAgo*3600000
  })).concat(state.sales.flatMap(sa=>sa.items.map(it=>({ product:it.product, qty:it.qty, amount:it.lineTotal, ts:sa.timestamp }))))

  html += '<div class="card" style="display:flex;flex-direction:column;justify-content:center;">'+

  '</div>';
  html += statCard('Gross profit', 'RWF '+fmt(fin.grossProfit), fin.margin.toFixed(1)+'% margin', 'var(--accent)', trendPill(profitTrend));
  html += statCard('COGS', 'RWF '+fmt(fin.cogs), 'FIFO batch cost');
  html += '</div>';
  html += '<div class="grid grid-stats" style="margin-top:12px;">';
  html += statCard('Stock cost value', 'RWF '+fmt(stockValue()), 'Across all batches');
  html += statCard('Net profit', 'RWF '+fmt(fin.netProfit), 'After RWF '+fmt(fin.operatingExpenses)+' expenses', fin.netProfit>=0?'var(--accent)':'var(--danger)');
  html += '</div>';

  html += '<div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);margin-top:12px;">';
  html += '<div class="card"><div class="row between" style="margin-bottom:4px;"><span class="xs semibold">Revenue — last 7 days + today</span></div>'+
    lineAreaChart(chartPoints, 140)+
    '<div class="xs faint" style="margin-top:8px;">Last 7 days are illustrative seed history; "Today" reflects sales completed in this demo session.</div>'+
  '</div>';
  html += '<div class="card"><div class="xs semibold" style="margin-bottom:10px;">Revenue by product</div>'+donutChart(donutSegments)+'</div>';
  html += '</div>';

  html += '<div class="grid grid-2" style="margin-top:12px;">';
  html += '<div class="card"><div class="xs semibold" style="margin-bottom:12px;">Top products</div>';
  merged.forEach(m=>{
    html += '<div style="margin-bottom:10px;">'+
      '<div class="row between xs" style="margin-bottom:4px;">'+
        '<span class="row gap2 medium"><span style="width:8px;height:8px;border-radius:50%;background:'+PRODUCT_COLOR[m.product.id]+';display:inline-block;"></span>'+esc(m.product.name)+'</span>'+

function renderAnalytics(){
  const fin = computeFinanceSummary();
  const stats = computeProductStats();
  const windowDays = 7;
  const revGrowth = pctChange(fin.revenue, HISTORY.lastWeekRevenue);

  let html = '<div class="grid grid-stats">';
  html += statCard('Revenue growth', (revGrowth>=0?'+':'')+revGrowth.toFixed(1)+'%', 'vs. previous week', revGrowth>=0?'var(--accent)':'var(--danger)');
  html += statCard('Gross margin', fin.margin.toFixed(1)+'%', 'RWF '+fmt(fin.grossProfit)+' gross profit');
  html += statCard('Net profit', 'RWF '+fmt(fin.netProfit), 'After RWF '+fmt(fin.operatingExpenses)+' expenses', fin.netProfit>=0?'var(--accent)':'var(--danger)');
  html += '</div>';

  const withVelocity = stats.map(s=>{
    const velocity = s.units/windowDays;
    const coverageDays = velocity>0 ? s.stock/velocity : null;
    const reorderSoon = coverageDays!==null && coverageDays<windowDays;
    return Object.assign({}, s, { velocity, coverageDays, reorderSoon });
  }).sort((a,b)=>b.velocity-a.velocity);

  html += '<div class="card" style="margin-top:12px;"><div class="row between" style="margin-bottom:4px;"><span class="xs semibold">Sales velocity &amp; stock coverage</span><span class="xs faint">Based on this week\u2019s units ÷ '+windowDays+' days</span></div>'+
    '<table style="margin-top:8px;"><thead><tr>'+['Product','Units (7d)','Velocity/day','Stock','Coverage',''].map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>';
  withVelocity.forEach(s=>{
    html += '<tr>'+
      '<td class="row gap2 medium"><span style="width:8px;height:8px;border-radius:50%;background:'+PRODUCT_COLOR[s.product.id]+';display:inline-block;"></span>'+esc(s.product.name)+'</td>'+
      '<td class="mono">'+s.units+'</td>'+
      '<td class="mono">'+s.velocity.toFixed(1)+'</td>'+
      '<td class="mono">'+s.stock+'</td>'+
      '<td class="mono">'+(s.coverageDays===null?'—':s.coverageDays.toFixed(1)+'d')+'</td>'+
      '<td>'+(s.reorderSoon?'<span class="badge" style="background:var(--warn-soft);color:var(--warn);">REORDER SOON</span>':'')+'</td>'+
    '</tr>';
  });
  html += '</tbody></table>'+
    '<div class="xs faint" style="margin-top:8px;">"Reorder soon" flags products with less than '+windowDays+' days of estimated stock coverage at the current sales velocity — an example threshold, reconfigurable in production.</div>'+
  '</div>';

  const topMovers = withVelocity.slice(0,3);
  const slowMovers = withVelocity.slice(-3).reverse();
  html += '<div class="grid grid-2" style="margin-top:12px;">';
  html += '<div class="card"><div class="xs semibold" style="margin-bottom:10px;">Fastest movers</div>'+
    topMovers.map(s=>'<div class="row between xs" style="margin-bottom:6px;"><span>'+esc(s.product.name)+'</span><span class="mono muted">'+s.velocity.toFixed(1)+'/day</span></div>').join('')+
  '</div>';
  html += '<div class="card"><div class="xs semibold" style="margin-bottom:10px;">Slowest movers</div>'+
    slowMovers.map(s=>'<div class="row between xs" style="margin-bottom:6px;"><span>'+esc(s.product.name)+'</span><span class="mono muted">'+s.velocity.toFixed(1)+'/day</span></div>').join('')+
  '</div>';
  html += '</div>';
  return html;
}

function renderPOS(){
  const q = state.search.toLowerCase();
  const list = state.products.filter(p=>p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q));
  const cartLines = computeCartLines();
  const subtotal = cartLines.reduce((s,l)=>s+l.lineTotal,0);
  const total = subtotal;
  const cashNum = parseFloat(state.cashReceived)||0;
  const change = state.paymentMethod==='Cash' ? cashNum-total : 0;
  const cartHasErrors = cartLines.some(l=>l.priceError||l.stockError);

  let left = renderSearchBar('Scan or search a product…');
  left += '<div class="pos-products" style="margin-top:12px;">';
  list.forEach(p=>{
    const stock = stockFor(p.id);

    const control = cartQty>0
      ? '<div class="qtybox"><button data-action="cart-adjust" data-id="'+p.id+'" data-delta="-1">'+icon('minus',11)+'</button><span class="mono xs" style="width:20px;text-align:center;">'+cartQty+'</span><button data-action="cart-adjust" data-id="'+p.id+'" data-delta="1" '+(cartQty>=stock?'disabled style="opacity:.4;"':'')+'>'+icon('plus',11)+'</button></div>'
      : '<button class="addbtn" data-action="cart-adjust" data-id="'+p.id+'" data-delta="1" '+(out?'disabled style="opacity:.4;"':'')+'>'+icon('plus',13)+'</button>';
    left += '<div class="card" style="padding:10px;'+(out?'opacity:.55;':'')+'">'+
      '<div class="row gap2" style="align-items:center;">'+
        '<div class="monogram">'+esc(p.name.charAt(0))+'</div>'+
        '<div class="grow"><div class="medium sm">'+esc(p.name)+'</div>'+
        '<div class="xs muted">'+esc(p.unit)+' · '+(out?'Out of stock':(stock+' available'))+'</div></div>'+
      '</div>'+
      '<div class="row between" style="margin-top:10px;">'+
        '<span class="mono semibold accent sm">RWF '+fmt(p.rec)+'</span>'+control+
      '</div>'+
    '</div>';
  });
  left += '</div>';

  let right = '<div class="card">';
  right += '<div class="row gap2 xs semibold" style="margin-bottom:10px;">'+icon('cart',14)+' Current sale</div>';
  if(cartLines.length===0){
    right += '<div class="empty">Cart is empty. Add a product from the left.</div>';
  } else {
    cartLines.forEach(l=>{
      right += '<div class="cart-item">'+
        '<div class="row between"><span class="xs medium">'+esc(l.product.name)+' <span class="faint">×'+l.qty+'</span></span>'+
        '<button data-action="remove-cart" data-id="'+l.productId+'" style="border:none;background:none;color:var(--ink-faint);cursor:pointer;">'+icon('trash',13)+'</button></div>'+
        '<div class="row gap2" style="margin-top:8px;">'+
          '<input class="input mono" data-bind="cartPrice" data-id="'+l.productId+'" inputmode="decimal" value="'+l.unitPrice+'" style="width:96px;'+(l.priceError?'border-color:var(--danger);':'')+'"/>'+
          '<span class="mono xs semibold" style="margin-left:auto;">RWF '+fmt(l.lineTotal)+'</span>'+
        '</div>'+
        (l.priceError||l.stockError ? '<div class="xs danger row gap1" style="margin-top:6px;">'+icon('alert',11)+' '+(l.priceError||l.stockError)+'</div>' : '')+
      '</div>';
    });
  }

  right += '<div class="dashed" style="margin-top:6px;padding-top:10px;">'+
    '<div class="row between xs muted"><span>Subtotal</span><span class="mono">RWF '+fmt(subtotal)+'</span></div>'+
    '<div class="row between xs faint" style="margin-top:2px;"><span>Tax</span><span>Not configured</span></div>'+
    '<div class="row between sm semibold" style="margin-top:4px;"><span>Total</span><span class="mono">RWF '+fmt(total)+'</span></div>'+
  '</div>';

  right += '<div style="margin-top:10px;">'+
    '<input class="input" data-bind="customerName" list="posCustomerList" placeholder="Customer (or Walk-in Customer)" value="'+esc(state.customerName)+'"/>'+
    '<datalist id="posCustomerList">'+state.customers.map(c=>'<option value="'+esc(c.name)+'">').join('')+'</datalist>'+
    '<div class="payment-grid">';
  ['Cash','Mobile Money','Bank','Card'].forEach(m=>{
    right += '<button class="paymethod '+(state.paymentMethod===m?'active':'')+'" data-action="set-payment" data-method="'+m+'">'+m+'</button>';

    (cartHasErrors?'Fix errors to continue':'Complete sale')+
  '</button>';
  right += '</div>';

  return '<div class="pos-layout"><div>'+left+'</div><div>'+right+'</div></div>';

  html += '<aside class="sidebar '+(state.sidebarCollapsed?'collapsed':'')+'">';
  html += '<div class="sidebar-brand"><div class="brandmark">'+initials(state.businessName)+'</div><div class="brand-text">'+esc(state.businessName)+'<span>Business &amp; POS</span></div></div>';
  html += '<button class="sidebar-toggle" data-action="toggle-sidebar" title="'+(state.sidebarCollapsed?'Expand':'Collapse')+' sidebar">'+icon('panel',15)+'</button>';
  html += '<nav class="sidebar-nav">';
  let lastGroup = null;
  TABS.forEach(t=>{
    if(t.group!==lastGroup){
      html += '<div class="side-group-label">'+esc(t.group)+'</div>';
      lastGroup = t.group;
    }
    html += '<button class="side-item '+(state.tab===t.id?'active':'')+'" data-action="set-tab" data-tab="'+t.id+'" title="'+esc(t.label)+'">'+icon(t.icon,16)+'<span class="label">'+esc(t.label)+'</span></button>';
  });
  html += '</nav>';
  html += '<div class="sidebar-footer">';
  html += '<button class="side-item '+(state.tab===SETTINGS_TAB.id?'active':'')+'" data-action="set-tab" data-tab="'+SETTINGS_TAB.id+'" title="Settings">'+icon(SETTINGS_TAB.icon,16)+'<span class="label">Settings</span></button>';
  html += '</div>';
  html += '</aside>';

  // Main column ----------------------------------------------------------
  html += '<div class="main-col">';

  html += '<header class="topbar">';
  html += '<div class="topbar-brand-mobile">'+esc(state.businessName)+'</div>';
  html += '<div class="topbar-search">'+icon('search',14)+'<input data-bind="globalSearch" placeholder="Search products, customers, sales\u2026" value="'+esc(state.globalSearch)+'"/></div>';
  html += '<button class="topbar-icon-btn scan-btn" data-action="set-tab" data-tab="pos" title="Scan">'+icon('scan',15)+'</button>';
  html += '<button class="topbar-newsale" data-action="set-tab" data-tab="pos">'+icon('plus',13)+' New Sale</button>';
  html += '<div class="topbar-context">';
  html += '<button class="topbar-icon-btn" data-action="reset-demo" title="Reset demo data">'+icon('rotate',15)+'</button>';
  html += '<button class="topbar-icon-btn" data-action="show-notifications" title="Notifications">'+icon('bell',15)+'</button>';
  html += '<div class="topbar-business">'+esc(state.businessName)+'</div>';
  html += '<div class="topbar-avatar" title="Demo Owner">DO</div>';
  html += '</div>';
  html += '</header>';

  if(state.showBanner){
    html += '<div class="banner">'+icon('info',14)+
      '<div>Demo data only — <span class="mono">XR, Wireless Mouse, iPhone 14, Samsung Galaxy A25, Kigali Tech Distributors Ltd, Mobile World Imports</span> are placeholder values (spec Rule 1 / Rule 141) for an electronics/phones/accessories demo — not real client data or market prices. Products, prices, thresholds and categories are all reconfigurable.</div>'+
      '<button data-action="close-banner" style="border:none;background:none;color:var(--warn);margin-left:auto;cursor:pointer;">'+icon('x',14)+'</button>'+
    '</div>';
  }

  html += '<div class="content">';
  if(state.tab==='dashboard') html += renderDashboard();
  else if(state.tab==='products') html += renderProducts();
  else if(state.tab==='inventory') html += renderInventory();
  else if(state.tab==='pos') html += renderPOS();
  else if(state.tab==='sales') html += renderSales();
  else if(state.tab==='purchases') html += renderPurchases();
  else if(state.tab==='customers') html += renderCustomers();
  else if(state.tab==='expenses') html += renderExpenses();
  else if(state.tab==='analytics') html += renderAnalytics();
  else if(state.tab==='documents') html += renderDocuments();
  else if(state.tab==='settings') html += renderSettings();
  else html += renderPlaceholder(ALL_TABS.find(t=>t.id===state.tab) || { label:'Section', icon:'info' });
  html += '</div>';

  html += '</div>'; // .main-col
  html += '</div>'; // .shell

  // Mobile bottom navigation + "More" sheet -------------------------------
  html += '<nav class="mobile-bottom-nav">';
  MOBILE_PRIMARY.forEach(t=>{
    html += '<button class="'+(state.tab===t.id?'active':'')+'" data-action="set-tab" data-tab="'+t.id+'">'+icon(t.icon,18)+'<span>'+t.label+'</span></button>';
  });
  html += '<button class="'+(state.mobileMoreOpen?'active':'')+'" data-action="toggle-more">'+icon('morehoriz',18)+'<span>More</span></button>';
  html += '</nav>';

  if(state.mobileMoreOpen){
    html += '<div class="mobile-more-sheet open" data-action="close-more">';
    html += '<div class="mobile-more-panel"><div class="mobile-more-handle"></div>';
    MOBILE_MORE_TABS.forEach(t=>{
      html += '<button class="side-item '+(state.tab===t.id?'active':'')+'" data-action="set-tab" data-tab="'+t.id+'">'+icon(t.icon,16)+'<span class="label">'+esc(t.label)+'</span></button>';
    });
    html += '</div></div>';
  }

  if(state.toast){
    html += '<div class="toast" style="background:'+(state.toast.type==='error'?'var(--danger)':'var(--accent)')+';">'+
      icon(state.toast.type==='error'?'alert':'check',14)+' '+esc(state.toast.message)+
    '</div>';
  }

  html += renderReceiptModal();

  app.innerHTML = html;

  if(focusInfo && focusInfo.bind){
    const sel = focusInfo.id!=null ? '[data-bind="'+focusInfo.bind+'"][data-id="'+focusInfo.id+'"]' : '[data-bind="'+focusInfo.bind+'"]';
    const el = app.querySelector(sel);
    if(el){
      el.focus();
      try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
    }
  }
}

// ---------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', function(){
  const app = document.getElementById('app');

  app.addEventListener('click', function(e){
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.getAttribute('data-action');
    const id = btn.getAttribute('data-id');
    if(action==='set-tab') { state.tab = btn.getAttribute('data-tab'); state.mobileMoreOpen=false; render(); }
    else if(action==='toggle-sidebar') { state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
    else if(action==='toggle-more') { state.mobileMoreOpen = !state.mobileMoreOpen; render(); }
    else if(action==='close-more') { state.mobileMoreOpen = false; render(); }
    else if(action==='show-notifications') { showToast('success','No new notifications yet.'); }
    else if(action==='cart-adjust') adjustCart(id, parseInt(btn.getAttribute('data-delta'),10));
    else if(action==='remove-cart') removeFromCart(id);
    else if(action==='set-payment') { state.paymentMethod = btn.getAttribute('data-method'); render(); }
    else if(action==='set-stock-filter') { state.stockFilter = btn.getAttribute('data-filter'); render(); }
    else if(action==='toggle-add-product') { state.showAddProduct = !state.showAddProduct; render(); }
    else if(action==='create-product') createProduct();
    else if(action==='complete-sale') completeSale();
    else if(action==='reset-demo') resetDemo();
    else if(action==='close-banner') { state.showBanner=false; render(); }
    else if(action==='close-receipt') { state.viewingReceipt=false; render(); }
    else if(action==='new-sale') { state.viewingReceipt=false; state.tab='pos'; render(); }
    else if(action==='view-sale') { state.receipt = state.sales.find(s=>s.id===id); state.viewingReceipt=true; render(); }
    else if(action==='create-purchase') createPurchase();
    else if(action==='receive-purchase') receivePurchase(id);
    else if(action==='add-customer') addCustomer();
    else if(action==='add-expense') addExpense();
  });

  app.addEventListener('input', function(e){
    const el = e.target;
    const bind = el.getAttribute && el.getAttribute('data-bind');
    if(!bind) return;
    if(bind==='search') state.search = el.value;
    else if(bind==='globalSearch') state.globalSearch = el.value;
    else if(bind==='customerName') state.customerName = el.value;
    else if(bind==='cashReceived') state.cashReceived = el.value;
    else if(bind==='cartPrice') { setCartPrice(el.getAttribute('data-id'), el.value); return; }
    else if(bind==='npProductId') state.npProductId = el.value;
    else if(bind==='npSupplier') state.npSupplier = el.value;
    else if(bind==='npQty') state.npQty = el.value;
    else if(bind==='npCost') state.npCost = el.value;
    else if(bind==='ncName') state.ncName = el.value;
    else if(bind==='ncPhone') state.ncPhone = el.value;
    else if(bind==='neCategory') state.neCategory = el.value;
    else if(bind==='neDescription') state.neDescription = el.value;
    else if(bind==='neAmount') state.neAmount = el.value;
    else if(bind==='pfName') state.pfName = el.value;
    else if(bind==='pfCategory') state.pfCategory = el.value;
    else if(bind==='pfUnit') state.pfUnit = el.value;
    else if(bind==='pfMin') state.pfMin = el.value;
    else if(bind==='pfRec') state.pfRec = el.value;
    else if(bind==='pfMax') state.pfMax = el.value;
    else if(bind==='businessName') state.businessName = el.value;
    else if(bind==='lowStockThreshold') state.lowStockThreshold = parseInt(el.value,10)||0;
    render();
  });

  app.addEventListener('keydown', function(e){
    const el = e.target;
    if(e.key==='Enter' && el.getAttribute && el.getAttribute('data-bind')==='globalSearch'){
      state.search = state.globalSearch;
      state.tab = 'products';
      state.mobileMoreOpen = false;
      render();
    }
  });

  render();
});
})();
</script>
</body>
</html>
