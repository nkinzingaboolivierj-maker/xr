<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XR — Mobile (Demo)</title>
<style>
  :root{
    --bg:#F6F5F1; --surface:#FFFFFF; --ink:#161F1A; --ink-muted:#6E7469; --ink-faint:#A7AA9F;
    --border:#E4E1D8; --line:#EDEAE1; --accent:#1F6F55; --accent-soft:#E6F1EC;
    --warn:#A9752B; --warn-soft:#FBF0DE; --danger:#AE4230; --danger-soft:#FBEAE5;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#EDEBE4;color:var(--ink);display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;min-height:100vh;-webkit-font-smoothing:antialiased;}
  .mono{font-family:ui-monospace,SFMono-Regular,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
  .row{display:flex;align-items:center;} .between{justify-content:space-between;} .wrap{flex-wrap:wrap;}
  .gap1{gap:4px;} .gap2{gap:8px;} .gap3{gap:12px;} .grow{flex:1;}
  .xs{font-size:12px;} .sm{font-size:13px;} .base{font-size:14px;} .lg{font-size:19px;}
  .muted{color:var(--ink-muted);} .faint{color:var(--ink-faint);} .accent{color:var(--accent);} .danger{color:var(--danger);}
  .semibold{font-weight:600;} .bold{font-weight:700;} .medium{font-weight:500;}
  .hero-label{font-size:12px;color:var(--ink-muted);margin-bottom:3px;}
  .hero-value{font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.08;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;}
  .list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .list-item{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);}
  .list-item:last-child{border-bottom:none;}
  .btn{border:none;cursor:pointer;border-radius:999px;font-size:13px;font-weight:600;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--border);}
  .btn:disabled{opacity:.5;} .btn-accent{background:var(--accent);color:#fff;border:none;} .btn-block{width:100%;padding:14px;font-size:14px;}
  input,select{font:inherit;color:inherit;}
  .input{border:1px solid transparent;border-radius:12px;padding:11px 13px;font-size:13px;outline:none;background:var(--bg);width:100%;transition:border-color .12s ease;}
  .input:focus{border-color:var(--accent);background:#fff;}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;}
  .icon{vertical-align:middle;display:inline-block;flex-shrink:0;}
  .dashed{border-top:1px dashed var(--border);}
  .empty{text-align:center;color:var(--ink-faint);padding:30px 14px;font-size:12px;}
  .monogram{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .quick-icon{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .bar-track{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden;display:block;}
  .bar-fill{height:100%;background:var(--accent);border-radius:99px;display:block;}
  ::-webkit-scrollbar{width:0;}

  /* Phone chrome ------------------------------------------------------ */
  .phone{position:relative;width:390px;height:min(844px,94vh);background:var(--bg);border:10px solid #14161a;border-radius:46px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;}
  .statusbar{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:8px 22px 2px 22px;font-size:13px;font-weight:600;color:var(--ink);}
  .statusbar .dot{width:4px;height:4px;border-radius:50%;background:var(--ink);display:inline-block;}
  @media (max-width:460px){
    body{padding:0;}
    .phone{width:100vw;height:100dvh;border:none;border-radius:0;box-shadow:none;}
  }

  .appbar{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:6px 14px 12px 14px;}
  .appbar-btn{border:none;background:var(--surface);border:1px solid var(--border);color:var(--ink);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .appbar-title{font-size:16px;font-weight:700;}
  .appbar-sub{font-size:11px;color:var(--ink-muted);font-weight:400;}

  .screen{flex:1;min-height:0;overflow-y:auto;padding:0 14px 90px 14px;}
  .full-screen{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:24px 22px;}

  .tabbar{flex-shrink:0;position:relative;display:flex;background:var(--surface);border-top:1px solid var(--border);padding:8px 4px calc(6px + env(safe-area-inset-bottom,0px)) 4px;}
  .tabbar button{flex:1;border:none;background:transparent;color:var(--ink-faint);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:4px 0;cursor:pointer;position:relative;}
  .tabbar button.active{color:var(--accent);}

  .fab-cart{position:absolute;right:16px;bottom:78px;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:12px 16px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:45;}
  .fab-cart .count{background:var(--accent);border-radius:999px;padding:1px 7px;font-size:11px;}

  .qtybox{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;background:#fff;}
  .qtybox button{border:none;background:transparent;padding:6px 9px;cursor:pointer;color:var(--ink);}
  .chip{border:1px solid var(--border);background:#fff;color:var(--ink-muted);border-radius:8px;padding:8px 4px;font-size:11px;cursor:pointer;text-align:center;}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .sheet-overlay{position:absolute;inset:0;background:rgba(27,30,26,.42);z-index:60;display:flex;align-items:flex-end;}
  .sheet{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom,0px)) 14px;max-height:78%;overflow-y:auto;}
  .sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--border);margin:6px auto 12px auto;}
  .sheet-group-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding:12px 6px 4px 6px;}
  .sheet-group-label:first-child{padding-top:0;}
  .sheet-item{border:none;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:11px 6px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;}
  .sheet-item:active{background:var(--bg);}

  .toast{position:absolute;left:14px;right:14px;bottom:82px;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:70;}

  .scanner-view{background:#14161a;border-radius:16px;height:220px;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:14px;overflow:hidden;}
  .scanner-frame{width:150px;height:150px;border:3px solid rgba(255,255,255,.7);border-radius:16px;position:relative;}
  .scanner-frame::before,.scanner-frame::after{content:'';position:absolute;width:26px;height:26px;border-color:var(--accent);}
  .scanner-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:11px;}

  .receipt-paper{background:#fff;}
  .scallop-top{height:12px;background-color:#fff;background-image:radial-gradient(circle at 10px 10px, var(--bg) 9px, transparent 9.5px);background-size:20px 20px;}
  .scallop-bottom{height:12px;background-color:#fff;background-image:radial-gradient(circle at 10px 0px, var(--bg) 9px, transparent 9.5px);background-size:20px 20px;}
</style>
</head>

function fmt(n){ return Math.round(n||0).toLocaleString('en-US'); }
function fmtDate(ts){ return new Date(ts).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
function fmtDateOnly(ts){ return new Date(ts).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function initials(name){ const p=(name||'').trim().split(/\s+/).filter(Boolean); return p.length?p.map(w=>w[0]).join('').slice(0,3).toUpperCase():'XR'; }
function agingBucket(days){
  if(days<=3) return { label:'Fresh', fg:'var(--accent)', bg:'var(--accent-soft)' };
  if(days<=7) return { label:'Aging', fg:'var(--warn)', bg:'var(--warn-soft)' };
  if(days<=14) return { label:'Old', fg:'var(--warn)', bg:'var(--warn-soft)' };
  return { label:'Critical', fg:'var(--danger)', bg:'var(--danger-soft)' };
}
function stockFor(productId){ return state.batches.filter(b=>b.productId===productId).reduce((s,b)=>s+b.qtyRemaining,0); }
function stockValue(){ return state.batches.reduce((s,b)=>s+b.qtyRemaining*b.unitCost,0); }
function pctChange(curr,prev){ if(!prev) return 0; return (curr-prev)/prev*100; }
function showToast(type,message){
  state.toast = { type, message };
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2600);
  render();
}
function computeFinanceSummary(){
  const liveRevenue = state.sales.reduce((s,sa)=>s+sa.total,0);
  const liveCOGS = state.sales.reduce((s,sa)=>s+sa.cogs,0);
  const histRevenue = HISTORY.days.reduce((s,d)=>s+d.revenue,0);
  const histCOGS = HISTORY.days.reduce((s,d)=>s+d.cogs,0);
  const revenue = histRevenue+liveRevenue, cogs = histCOGS+liveCOGS;
  const grossProfit = revenue-cogs;
  const margin = revenue>0 ? (grossProfit/revenue*100) : 0;
  const operatingExpenses = state.expenses.reduce((s,e)=>s+e.amount,0);
  return { liveRevenue, revenue, cogs, grossProfit, margin, operatingExpenses, netProfit: grossProfit-operatingExpenses };
}
function computeProductStats(){
  const live = {};
  state.sales.forEach(sa=>sa.items.forEach(i=>{ if(!live[i.productId]) live[i.productId]={units:0,revenue:0}; live[i.productId].units+=i.qty; live[i.productId].revenue+=i.lineTotal; }));
  return state.products.map(p=>{
    const seed = HISTORY.productStats[p.id]||{units:0,revenue:0}; const l = live[p.id]||{units:0,revenue:0};
    return { product:p, units:seed.units+l.units, revenue:seed.revenue+l.revenue, stock:stockFor(p.id) };
  });
}

function addToCart(productId, qty){
  qty = qty||1;
  const product = state.products.find(p=>p.id===productId);
  const available = stockFor(productId);
  const item = state.cart.find(i=>i.productId===productId);
  const current = item?item.qty:0;
  if(current+qty>available){ showToast('error','Only '+available+' available.'); return; }
  if(item) item.qty += qty; else state.cart.push({ productId, qty, unitPrice:product.rec });
  render();
}
function adjustCartQty(productId, delta){
  const item = state.cart.find(i=>i.productId===productId);
  if(!item) return;
  const available = stockFor(productId);
  const next = item.qty+delta;
  if(delta>0 && next>available){ showToast('error','Only '+available+' available.'); return; }
  if(next<=0){ state.cart = state.cart.filter(i=>i.productId!==productId); }
  else item.qty = next;
  render();
}
function removeFromCart(productId){ state.cart = state.cart.filter(i=>i.productId!==productId); render(); }
function computeCartLines(){
  return state.cart.map(item=>{
    const product = state.products.find(p=>p.id===item.productId);
    const available = stockFor(item.productId);
    const stockError = item.qty>available ? ('Only '+available+' available') : null;
    return Object.assign({}, item, { product, available, stockError, lineTotal:item.qty*item.unitPrice });
  });
}
function completeSale(){
  const lines = computeCartLines();
  if(lines.length===0){ showToast('error','Cart is empty.'); return; }
  if(lines.some(l=>l.stockError)){ showToast('error','Fix stock issues before completing the sale.'); return; }
  const total = lines.reduce((s,l)=>s+l.lineTotal,0);
  const cashNum = parseFloat(state.cashReceived)||0;
  if(state.paymentMethod==='Cash' && cashNum<total){ showToast('error','Cash received is less than the total due.'); return; }

  const working = state.batches.map(b=>Object.assign({},b));
  const saleItems = [];
  for(const line of lines){
    let remaining = line.qty; const allocations = [];
    const avail = working.filter(b=>b.productId===line.productId && b.qtyRemaining>0).sort((a,b)=>a.receivedAt-b.receivedAt);
    for(const b of avail){
      if(remaining<=0) break;
      const take = Math.min(b.qtyRemaining, remaining);
      if(take>0){ allocations.push({batchId:b.id,qty:take,unitCost:b.unitCost}); b.qtyRemaining-=take; remaining-=take; }
    }
    if(remaining>0){ showToast('error','Insufficient stock for '+line.product.name+'.'); return; }
    const cost = allocations.reduce((s,a)=>s+a.qty*a.unitCost,0);
    saleItems.push(Object.assign({}, line, { allocations, cost, profit:line.lineTotal-cost }));
  }
  const cogs = saleItems.reduce((s,i)=>s+i.cost,0);
  const saleNumber = 'SAL-'+String(state.saleCounter).padStart(6,'0');
  state.saleCounter += 1;
  const record = {
    id:saleNumber, saleNumber, items:saleItems, subtotal:total, total, cogs, profit:total-cogs,
    paymentMethod:state.paymentMethod, cashReceived: state.paymentMethod==='Cash'?cashNum:null,
    change: state.paymentMethod==='Cash' ? (cashNum-total) : null,
    customerName: state.customerName||'Walk-in Customer', timestamp:Date.now(), businessName:state.businessName,
  };
  state.batches = working;
  state.sales.unshift(record);
  state.cart = []; state.cashReceived = ''; state.customerName='Walk-in Customer'; state.paymentMethod='Cash';
  state.selectedProductId = record.id; // reused as "current receipt id" for the receipt screen
  state.screenHistory = [];
  state.screen = 'receipt';
  render();
  showToast('success','Sale '+saleNumber+' completed.');
}

function receivePurchase(purchaseId){
  const purchase = state.purchases.find(p=>p.id===purchaseId);
  if(!purchase || purchase.status!=='DRAFT') return;
  const batchNumber = 'BATCH-'+String(state.batchCounter).padStart(6,'0');

  state.batches.push(batch);
  purchase.status='RECEIVED'; purchase.receivedAt=batch.receivedAt; purchase.batchId=batch.id;
  render();

}

function renderCart(){

  let html = appBar('Checkout', { back:true, sub: lines.length+' item'+(lines.length===1?'':'s') });

function renderAnalyticsScreen(){
  const fin = computeFinanceSummary();
  const revGrowth = pctChange(fin.revenue, HISTORY.lastWeekRevenue);
  const windowDays = 7;
  const stats = computeProductStats().map(s=>{
    const velocity = s.units/windowDays; const coverageDays = velocity>0 ? s.stock/velocity : null;
    return Object.assign({}, s, { velocity, coverageDays, reorderSoon: coverageDays!==null && coverageDays<windowDays });
  }).sort((a,b)=>b.velocity-a.velocity);

  let html = appBar('Analytics', { back:true });
  html += '<div class="screen">';
  html += '<div class="row gap2" style="margin-bottom:8px;">';
  html += '<div class="grow">'+statCard('Revenue growth', (revGrowth>=0?'+':'')+revGrowth.toFixed(1)+'%', 'vs. last week', revGrowth>=0?'var(--accent)':'var(--danger)')+'</div>';
  html += '<div class="grow">'+statCard('Margin', fin.margin.toFixed(1)+'%', 'RWF '+fmt(fin.grossProfit)+' gross')+'</div>';
  html += '</div>';
  html += '<div class="xs semibold" style="margin:12px 0 8px 0;">Sales velocity &amp; coverage</div>';
  const maxVelocity = Math.max(1, ...stats.map(s=>s.velocity));
  html += '<div class="list">';
  stats.forEach(s=>{
    html += '<div class="list-item" style="display:block;"><div class="row between xs medium">'+esc(s.product.name)+
      (s.reorderSoon?'<span class="badge" style="background:var(--warn-soft);color:var(--warn);">REORDER SOON</span>':'')+'</div>'+
      '<div class="bar-track" style="margin-top:7px;"><span class="bar-fill" style="display:block;width:'+(s.velocity/maxVelocity*100)+'%;background:'+PRODUCT_COLOR[s.product.id]+';"></span></div>'+
      '<div class="row between xs muted" style="margin-top:6px;"><span>'+s.units+' units/7d · '+s.velocity.toFixed(1)+'/day</span><span>'+(s.coverageDays===null?'—':s.coverageDays.toFixed(1)+'d cover')+'</span></div></div>';
  });
  html += '</div>';
  html += '<div class="xs faint" style="margin-top:8px;">"Reorder soon" = under '+windowDays+' days of estimated coverage — an example threshold.</div>';
  html += '</div>';
  return html;
}

function renderDocumentsScreen(){
  const sales = state.sales.slice().sort((a,b)=>b.timestamp-a.timestamp);
  let html = appBar('Documents', { back:true });
  html += '<div class="screen">';
  html += '<div class="card" style="margin-bottom:10px;"><div class="row gap2 xs">'+icon('info',14)+
    '<span>This demo generates receipts only. Invoices and reports are additional document types production would support.</span></div></div>';
  if(sales.length===0){ html += '<div class="empty">No documents yet — complete a sale to generate a receipt.</div></div>'; return html; }
  html += '<div class="list">';
  sales.forEach(s=>{
    html += '<div class="list-item" data-action="open-receipt" data-id="'+s.id+'" style="cursor:pointer;"><div class="grow">'+
      '<div class="row between xs medium"><span>'+s.saleNumber+'</span><span class="mono">RWF '+fmt(s.total)+'</span></div>'+
      '<div class="xs faint" style="margin-top:3px;">Receipt · '+fmtDate(s.timestamp)+'</div></div></div>';
  });
  html += '</div></div>';

}

function renderNotifications(){
  const lowStock = state.products.filter(p=>stockFor(p.id)<state.lowStockThreshold);
  let html = appBar('Notifications', { back:true });
  html += '<div class="screen">';
  html += '<div class="card" style="margin-bottom:10px;"><div class="row gap2 xs">'+icon('info',14)+
    '<span>These are generated live from current stock levels — there\u2019s no persisted notification/rules backend in this demo yet.</span></div></div>';
  if(lowStock.length===0){ html += '<div class="empty">No alerts right now.</div>'; }
  else lowStock.forEach(p=>{
    const stock = stockFor(p.id);
    html += '<div class="card" data-action="open-product" data-id="'+p.id+'" style="margin-bottom:8px;cursor:pointer;background:var(--danger-soft);border-color:var(--danger-soft);">'+
      '<div class="row gap2 xs medium danger">'+icon('alert',14)+' Low stock: '+esc(p.name)+'</div>'+
      '<div class="xs muted" style="margin-top:4px;">'+stock+' left · reorder below '+state.lowStockThreshold+'</div></div>';
  });
  html += '</div>';
  return html;
}

    '<div class="row between xs" style="margin-top:4px;"><span class="muted">Timezone</span><span class="mono">Africa/Kigali</span></div></div>';

// ---------------------------------------------------------------------
// Root render
// ---------------------------------------------------------------------
const TAB_SCREENS = ['home','scan','sales','inventory'];
function render(){
  const app = document.getElementById('app');
  let html = '<div class="phone">';
  html += '<div class="statusbar"><span>9:41</span><span class="row gap1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div>';

  if(!state.loggedIn){
    html += renderLogin();
  } else if(!state.businessSelected){
    html += renderBusinessSelect();
  } else {
    if(state.screen==='home') html += renderHome();
    else if(state.screen==='scan') html += renderScan();
    else if(state.screen==='sales') html += renderSales();
    else if(state.screen==='inventory') html += renderInventory();
    else if(state.screen==='productDetail') html += renderProductDetail();
    else if(state.screen==='cart') html += renderCart();
    else if(state.screen==='receipt') html += renderReceipt();
    else if(state.screen==='products') html += renderProductsScreen();
    else if(state.screen==='purchases') html += renderPurchasesScreen();
    else if(state.screen==='customers') html += renderCustomersScreen();
    else if(state.screen==='expenses') html += renderExpensesScreen();
    else if(state.screen==='analytics') html += renderAnalyticsScreen();
    else if(state.screen==='documents') html += renderDocumentsScreen();
    else if(state.screen==='notifications') html += renderNotifications();
    else if(state.screen==='settings') html += renderSettingsScreen();
    else if(state.screen==='devices') html += renderDevices();
    else if(state.screen==='profile') html += renderProfile();
    else html += renderHome();

    if(state.cart.length>0 && state.screen!=='cart'){
      html += '<button class="fab-cart" data-action="goto-cart">'+icon('cart',15)+' Cart <span class="count">'+state.cart.reduce((s,i)=>s+i.qty,0)+'</span></button>';
    }

    html += '<nav class="tabbar">';
    [['home','Home','home'],['scan','Scan','scan'],['sales','Sales','receipt'],['inventory','Inventory','layers']].forEach(function(t){
      var id=t[0], label=t[1], ic=t[2];
      html += '<button class="'+(TAB_SCREENS.indexOf(state.screen)!==-1&&state.screen===id?'active':'')+'" data-action="goto-tab" data-tab="'+id+'">'+icon(ic,18)+'<span>'+label+'</span></button>';
    });
    html += '<button class="'+(state.moreSheetOpen?'active':'')+'" data-action="toggle-more">'+icon('morehoriz',18)+'<span>More</span></button>';
    html += '</nav>';

    html += renderMoreSheet();
    html += renderCustomerPicker();
  }

  if(state.toast){
    html += '<div class="toast" style="background:'+(state.toast.type==='error'?'var(--danger)':'var(--accent)')+';">'+icon(state.toast.type==='error'?'alert':'check',14)+' '+esc(state.toast.message)+'</div>';
  }

  html += '</div>';

  let focusInfo = null;
  const active = document.activeElement;
  if(active && app.contains(active) && (active.tagName==='INPUT'||active.tagName==='SELECT')){
    focusInfo = { bind:active.getAttribute('data-bind'), start:active.selectionStart, end:active.selectionEnd };
  }

  app.innerHTML = html;

  if(focusInfo && focusInfo.bind){
    const el = app.querySelector('[data-bind="'+focusInfo.bind+'"]');
    if(el){ el.focus(); try{ el.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){} }
  }
}

// ---------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------
document.addEventListener('DOMContentLoaded', function(){
  const app = document.getElementById('app');

  app.addEventListener('click', function(e){
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.getAttribute('data-action');
    const id = btn.getAttribute('data-id');
    if(action==='login'){ if(!state.loginEmail.trim()){ showToast('error','Enter an email to continue.'); return; } state.loggedIn=true; render(); }
    else if(action==='select-business'){ state.activeBusinessId=id; state.businessSelected=true; state.screen='home'; render(); }
    else if(action==='logout') logout();
    else if(action==='back') goBack();
    else if(action==='goto-tab') goToTab(btn.getAttribute('data-tab'));
    else if(action==='goto-tab-home') goToTab('home');
    else if(action==='goto-tab-sales') goToTab('sales');
    else if(action==='goto-scan') goToTab('scan');
    else if(action==='goto-purchases') goTo('purchases');
    else if(action==='goto-cart') goTo('cart');
    else if(action==='toggle-more') { state.moreSheetOpen = !state.moreSheetOpen; render(); }
    else if(action==='close-more') { state.moreSheetOpen = false; render(); }
    else if(action==='goto-more-screen') goTo(btn.getAttribute('data-screen'));
    else if(action==='open-notifications') goTo('notifications');
    else if(action==='open-product') goTo('productDetail', { productId:id });
    else if(action==='add-to-cart') { addToCart(id, 1); showToast('success','Added to cart.'); }
    else if(action==='cart-adjust') adjustCartQty(id, parseInt(btn.getAttribute('data-delta'),10));
    else if(action==='remove-cart') removeFromCart(id);
    else if(action==='open-customer-picker') { state.pickerOpen='customer'; render(); }
    else if(action==='close-picker') { state.pickerOpen=null; render(); }
    else if(action==='pick-customer') { state.customerName = btn.getAttribute('data-name'); state.pickerOpen=null; render(); }
    else if(action==='set-payment') { state.paymentMethod = btn.getAttribute('data-method'); render(); }
    else if(action==='set-stock-filter') { state.stockFilter = btn.getAttribute('data-filter'); render(); }
    else if(action==='toggle-add-product') { state.showAddProduct = !state.showAddProduct; render(); }
    else if(action==='create-product') createProduct();
    else if(action==='complete-sale') completeSale();
    else if(action==='open-receipt') goTo('receipt', { productId:id });
    else if(action==='simulate-scan') { const p = state.products[state.scanRotation % state.products.length]; state.scanRotation++; goTo('productDetail', { productId:p.id }); }
    else if(action==='create-purchase') createPurchase();
    else if(action==='receive-purchase') receivePurchase(id);
    else if(action==='add-customer') addCustomer();
    else if(action==='add-expense') addExpense();
    else if(action==='reset-demo') resetDemo();
  });

  app.addEventListener('input', function(e){
    const el = e.target;
    const bind = el.getAttribute && el.getAttribute('data-bind');
    if(!bind) return;
    if(bind==='loginEmail') state.loginEmail = el.value;
    else if(bind==='loginPassword') state.loginPassword = el.value;
    else if(bind==='search') state.search = el.value;
    else if(bind==='cashReceived') state.cashReceived = el.value;
    else if(bind==='npProductId') state.npProductId = el.value;
    else if(bind==='npSupplier') state.npSupplier = el.value;
    else if(bind==='npQty') state.npQty = el.value;
    else if(bind==='npCost') state.npCost = el.value;
    else if(bind==='ncName') state.ncName = el.value;
    else if(bind==='ncPhone') state.ncPhone = el.value;
    else if(bind==='neCategory') state.neCategory = el.value;
    else if(bind==='neDescription') state.neDescription = el.value;
    else if(bind==='neAmount') state.neAmount = el.value;
    else if(bind==='pfName') state.pfName = el.value;
    else if(bind==='pfCategory') state.pfCategory = el.value;
    else if(bind==='pfMin') state.pfMin = el.value;
    else if(bind==='pfRec') state.pfRec = el.value;
    else if(bind==='pfMax') state.pfMax = el.value;
    else if(bind==='businessName') state.businessName = el.value;
    else if(bind==='lowStockThreshold') state.lowStockThreshold = parseInt(el.value,10)||0;
    render();
  });

  render();
});
})();
</script>
