name: Unpack XR source ZIP

on:
  push:
    branches: [main]
    paths:
      - ".unpack-request"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract XR source into repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( *.zip )
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one ZIP at repository root; found ${#archives[@]}."
            exit 1
          fi
          work="$RUNNER_TEMP/xr-source"
          mkdir -p "$work"
          unzip -q "${archives[0]}" -d "$work"
          mapfile -t roots < <(find "$work" -mindepth 1 -maxdepth 1 -type d)
          if [[ ${#roots[@]} -ne 1 ]]; then
            echo "Expected one top-level source folder; found ${#roots[@]}."
            exit 1
          fi
          rsync -a --exclude='.git' "${roots[0]}/" ./
          rm -f -- "${archives[@]}" .unpack-request
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: unpack XR v1.2.4 source"
          git push
